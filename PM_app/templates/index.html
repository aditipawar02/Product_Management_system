{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body {
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f8f3fc;
}

    .navbar {
    background: linear-gradient(90deg, #6a0572, #ab47bc);
}

.navbar-brand {
    color: white !important;
    font-weight: bold;
    font-size: 24px;
}

.nav-link {
    color: white !important;
    margin-left: 10px;
}

.nav-link:hover {
    color: #f3d9ff !important;
}

        .hero {
    min-height: 90vh;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;

    background:
    linear-gradient(rgba(255,255,255,0.20), rgba(255,255,255,0.20)),
    url("{% static 'PM_app/background.jpg.webp' %}");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


     .hero h1 {
    font-size: 48px;
    font-weight: bold;
    color: #4a044e;
    background: rgba(255, 255, 255, 0.55);
    padding: 20px 30px;
    border-radius: 20px;
    display: inline-block;
    backdrop-filter: blur(8px);
    box-shadow: 0 4px 20px rgba(74, 4, 78, 0.12);
}
.hero p {
    font-size: 20px;
    color: #050507;
    margin: 20px 0;
    font-weight: 500;
}

        .btn-custom {
    background: #c084fc;
    color: #4a044e;
    padding: 12px 30px;
    border-radius: 30px;
    text-decoration: none;
    transition: 0.3s;
}

.btn-custom:hover {
    background: #a855f7;
    color: white;
}

        footer {
    background: #4a044e;
    color: white;
    text-align: center;
    padding: 15px;
}

    </style>

    {% block head %}
    {% endblock %}

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="{% url 'index' %}">
            Product Management
        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add' %}">Add Product</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'list' %}">View Products</a>
                </li>
                

            </ul>

        </div>

    </div>

</nav>

{% block body %}

<div class="hero">

    <div>

        <h1>📦 Product Management System 📦</h1>

        <p>
            Manage your products quickly and efficiently.
        </p>

        <a href="{% url 'list' %}" class="btn-custom">
            View Products
        </a>

    </div>

</div>

{% endblock %}

<footer>

    © 2026 Product Management System |

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
