
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            margin:0;
            padding:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#7d1287;
        }

        .navbar{
            background:linear-gradient(90deg,#e74cc8,#870955);
        }

        .navbar-brand{
            color:white !important;
            font-weight:bold;
            font-size:24px;
        }

        .nav-link{
            color:white !important;
            margin-left:10px;
        }

        .nav-link:hover{
            color:#3b0202 !important;
        }

        .hero{
            min-height:90vh;
            display:flex;
            justify-content:center;
            align-items:center;
            text-align:center;
            background:linear-gradient(135deg,#f4eef1,#f7cee3);
        }

        .hero h1{
            font-size:55px;
            font-weight:bold;
            color:#56084e;
        }

        .hero p{
            font-size:20px;
            color:#681010;
            margin:20px 0;
        }

        .btn-custom{
            background:#a70563;
            color:white;
            padding:12px 30px;
            border-radius:30px;
            text-decoration:none;
            transition:.3s;
        }

        .btn-custom:hover{
            background:#ee8ee1;
            color:white;
        }

        footer{
            background:#212529;
            color:white;
            text-align:center;
            padding:15px;
        }

    </style>

    {% block head %}
    {% endblock %}

</head>

<body>

<nav class="navbar navbar-expand-lg">

    <div class="container">

        <a class="navbar-brand" href="{% url 'index' %}">
            Product Management
        </a>

        <button class="navbar-toggler bg-light"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'index' %}">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'add' %}">Add Product</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{% url 'list' %}">View Products</a>
                </li>
                

            </ul>

        </div>

    </div>

</nav>

{% block body %}

<div class="hero">

    <div>

        <h1>📦 Product Management System 📦</h1>

        <p>
            Manage your products quickly and efficiently.
        </p>

        <a href="{% url 'list' %}" class="btn-custom">
            View Products
        </a>

    </div>

</div>

{% endblock %}

<footer>

    © 2026 Product Management System |

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
